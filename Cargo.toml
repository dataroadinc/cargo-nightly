[package]
name = "cargo-nightly"
description = "Cargo subcommand to forward commands to the nightly toolchain, enabling nightly toolchain usage in cargo aliases"
version = "0.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
repository = "https://github.com/legra-ai/cargo-nightly"
documentation = "https://docs.rs/cargo-nightly"
homepage = "https://github.com/legra-ai/cargo-nightly"
rust-version = "1.94.1"
readme = "README.md"
keywords = ["cargo", "nightly", "toolchain", "cli", "alias"]
categories = ["command-line-utilities", "development-tools"]
publish = true

exclude = [
    ".cargo/",
    ".cargo-husky/",
    ".clippy.toml",
    ".cursor/",
    ".github/",
    ".gitignore",
    ".rust-toolchain.toml",
    ".vscode/",
    "cog.toml",
    "rustfmt.toml",
]

[lib]
name = "cargo_nightly"
path = "src/lib.rs"

[[bin]]
name = "cargo-nightly"
path = "src/main.rs"

[dependencies]

[build-dependencies]
cargo-version-info = "0.0.21"
rhusky = "0.0.6"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"
